services:
  # Base de Datos Principal
  mysql:
    image: mysql:8.0
    container_name: mysql8
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      # Credenciales iniciales para levantar la BD vacía.
      # Usuarios más restrictivos se crean con scripts SQL.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      # Guardamos los datos en un volumen para no perderlos si borramos el contenedor.
      - mysql_data:/var/lib/mysql
      # Montamos nuestra configuración personalizada en solo lectura.
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      # Comprobamos que MySQL está realmente listo.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

# Volumen persistente de MySQL.
volumes:
  mysql_data: